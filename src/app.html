<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff0f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Thème posé AVANT le premier paint. Un effet s'exécute après, et un
         visiteur en sombre prendrait un flash clair à chaque chargement.

         Inline et non module : un module est différé, donc exécuté après le
         paint — ce qui est exactement le flash qu'on évite.

         Ces lignes sont la copie de THEME_BOOT dans `$lib/ui/theme.ts`, un
         `<head>` ne pouvant pas importer de TypeScript. Le monorepo en portait
         cinq copies, une par index.html ; il n'en reste qu'une. -->
    <script>
      (function () {
        var t = localStorage.getItem("glyph:theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "dark" ? "#0e1013" : "#eff0f1");
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
