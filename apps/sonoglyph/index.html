<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff0f1" />
    <meta
      name="description"
      content="Préview des deux Glyph Toys de Sonoglyph : visualiseur de spectre et VU-mètre à aiguille, sur la Glyph Matrix du Nothing Phone (3)."
    />
    <title>SONOGLYPH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Thème posé AVANT le premier paint — voir THEME_BOOT dans @glyph/kit. -->
    <script>
      (function () {
        var t = localStorage.getItem("glyph:theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "dark" ? "#0e1013" : "#eff0f1");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
